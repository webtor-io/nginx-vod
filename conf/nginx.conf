worker_processes  auto;

events {
	worker_connections 16384;
}

http {
	log_format  main  '$remote_addr $remote_user [$time_local] "$request" '
		'$status "$http_referer" "$http_user_agent"';

	access_log  /dev/stdout  main;
	error_log   stderr error;

	default_type  application/octet-stream;
	include       /usr/local/nginx/conf/mime.types;

	sendfile    on;
	tcp_nopush  on;
	tcp_nodelay on;

	vod_mode                           remote;
	vod_upstream_location              /remote;
	vod_metadata_cache                 metadata_cache 1024m;
	vod_response_cache                 response_cache 512m;
	vod_base_url                       '';

	# Read mp4 data from upstream in large chunks. Default is 256K which
	# produced ~136 subrequests per 22 MB 4K HLS segment — each with its
	# own THP → TWS round-trip latency. 4 MB cuts that to ~6 subrequests.
	vod_cache_buffer_size              4m;
	vod_initial_read_size              256k;

	vod_last_modified_types            *;
	# vod_segment_duration               9000;
	# vod_align_segments_to_key_frames   on;
	vod_dash_fragment_file_name_prefix "s";
	vod_hls_segment_file_name_prefix   "s";

	vod_manifest_segment_durations_mode accurate;

	secure_token_avoid_cookies on;
	secure_token_types application/vnd.apple.mpegurl application/dash+xml text/xml;
	secure_token $token;

	vod_upstream_extra_args $token;

	proxy_http_version 1.1;
	proxy_set_header   Connection "";

	proxy_connect_timeout 10s;
	proxy_send_timeout    60s;
	proxy_read_timeout    120s;

	# Only the module's /remote reads are proxied, as in-memory
	# subrequests: each read is copied into the module's own
	# vod_cache_buffer_size buffer. A subrequest allocates its proxy
	# buffers from the segment request's pool, freed only when the segment
	# ends, so with buffering on the reads left a second copy behind
	# (OOM 2026-10-17). Off reads through one proxy_buffer_size buffer.
	# Peak per request on a 66 MiB segment (2026-11-06): fMP4 1.5-2.2x the
	# segment on, 1.2x off; TS 2.4-3.0x on, 2.1x off (TS also holds its
	# output). Same bytes either way. Read-ahead is vod_cache_buffer_size.
	proxy_buffering             off;
	proxy_buffer_size           128k;
	# Unused with buffering off, but nginx checks at load that
	# proxy_busy_buffers_size (default 2 x proxy_buffer_size) fits in the
	# proxy_buffers minus one: the default 8 x 4k fails with 128k above.
	proxy_buffers               4 128k;

	gzip             on;
	gzip_types       application/vnd.apple.mpegurl application/dash+xml text/xml text/vtt;
	gzip_proxied     any;
	gzip_min_length  1024;

	keepalive_timeout  60;
	keepalive_requests 1000;

	# On a graceful stop nginx exits once the last response is in the
	# kernel, and the pod's network goes with the container: the tail not
	# yet sent was lost and the reader hung without a FIN. A lingering close
	# sends the FIN after the data and holds the socket until the reader
	# closes (thp does once it has read everything), up to 30 s.
	lingering_close   always;
	lingering_timeout 30s;

	upstream remote {
		server torrent-http-proxy;
		keepalive          64;
		keepalive_requests 1000;
	}

	map $http_x_tokenize $token {
       "no" "";
       default $args;
	}

	server {
        listen 80;
        server_name localhost;
		root /opt/static;

		location = / {
			access_log off;
			return 200 "ok\n";
		}

		location /health {
			access_log off;
			return 200 "healthy\n";
		}

		location ~ /remote/[^/]+/(.*) {
			internal;
			proxy_pass http://remote$http_x_full_path$is_args$args;
		}

		location /hls/ {
			vod hls;

			vod_bootstrap_segment_durations 2000;
			vod_bootstrap_segment_durations 2000;
			vod_bootstrap_segment_durations 2000;
			vod_bootstrap_segment_durations 4000;
			vod_bootstrap_segment_durations 4000;
			vod_bootstrap_segment_durations 6000;

			add_header Access-Control-Allow-Headers '*';
			add_header Access-Control-Allow-Origin '*';
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
		}
	}
}
